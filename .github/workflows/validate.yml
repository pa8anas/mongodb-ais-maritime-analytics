name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and GeoJSON samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("data/samples").glob("*.json")) + list(Path("data/samples").glob("*.geojson"))
          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"valid: {path}")
          PY

      - name: Syntax-check mongosh scripts
        run: |
          for file in scripts/*.js; do
            node --check "$file"
          done
